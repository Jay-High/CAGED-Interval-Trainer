<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0a1d">
<title>CAGED Interval Trainer</title>
<style>
:root{--bg:#0e0a1d;--panel:#181230;--panel2:#241b4a;--line:#3d3170;--text:#f4f0ff;--muted:#a89fc9;--root:#c8a6ff;--root2:#9b6bff;--good:#35e0a1;--bad:#ff5d7a;--alt:#ffb454;--row:clamp(40px,12.5vw,58px);--d:calc(var(--row)*.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;background:radial-gradient(900px 500px at 90% -10%,#5a32b855,transparent),radial-gradient(700px 420px at -10% 105%,#8a35c444,transparent),var(--bg) fixed}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 14px;transition:transform .12s,filter .15s}
button:active{transform:scale(.96)}button:focus-visible{outline:2px solid var(--root);outline-offset:2px}
.app{max-width:1000px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 10px #8f5cff88)}
.brand{font-size:clamp(15px,4.6vw,20px);font-weight:800;letter-spacing:.2px;line-height:1.15}.sub{color:var(--muted);font-size:12px}.sp{flex:1}
.ib{width:42px;height:42px;padding:0;font-size:18px;border-radius:50%}
.layout{display:grid;gap:12px}
.card{background:linear-gradient(160deg,#1f1642dd,#161030dd);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 10px 30px #0006}
.task{display:flex;flex-direction:column;gap:8px;position:relative}
.verdict{min-height:34px;display:flex;align-items:center;font-weight:800;font-size:19px;color:var(--muted)}
.verdict.good{color:var(--good);text-shadow:0 0 16px #35e0a199;animation:rise .45s}
.verdict.bad{color:var(--bad);text-shadow:0 0 16px #ff5d7a99;animation:rise .45s}
.verdict.alt{color:var(--alt);animation:rise .45s;font-size:15px}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.9)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shape{font-weight:800;color:var(--root);font-size:17px;display:flex;align-items:center;gap:8px}
.shape:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--root);box-shadow:0 0 10px var(--root)}
.hint{color:var(--muted);font-size:13px}
#seq{position:relative;display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.step{position:relative;min-width:58px;text-align:center;font-size:28px;font-weight:850;padding:10px 16px;border-radius:16px;background:var(--panel2);color:#b9aee6;border:1px solid var(--line);transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1),background .25s,box-shadow .25s}
.step.pre{opacity:0;transform:scale(.6) translateY(8px)}
.step.r{color:var(--root);border-color:#8c6bd6}
.step.cur{background:linear-gradient(145deg,#a77bff,#7c4dea);color:#fff;border-color:#e3d0ff;transform:scale(1.07);box-shadow:0 0 0 3px #c8a6ff33,0 8px 26px #8f5cff88}
.step.cur.r{background:linear-gradient(145deg,#e6d3ff,#c8a6ff);color:#2a1457;box-shadow:0 0 0 3px #c8a6ff55,0 0 30px #c8a6ffcc}
.step.done{opacity:.4;color:var(--good);border-color:#35e0a155;background:transparent}
.step.done:after{content:"✓";position:absolute;right:5px;top:1px;font-size:11px}
.step.puff{animation:puff 1.1s linear forwards;background:var(--good);color:#06291c;border-color:#fff}
.step.shake{animation:shake .45s}
@keyframes puff{0%{transform:scale(1);opacity:1;filter:brightness(1) blur(0)}25%{transform:scale(1.15);opacity:1;filter:brightness(1.35) blur(0)}60%{transform:scale(1.42);opacity:.55;filter:brightness(1.2) blur(3px)}100%{transform:scale(1.75);opacity:0;filter:brightness(1) blur(9px)}}
@keyframes shake{0%,100%{transform:scale(1.07)}20%{transform:translateX(-9px) scale(1.07);background:var(--bad);color:#fff}40%{transform:translateX(8px) scale(1.07);background:var(--bad);color:#fff}60%{transform:translateX(-5px) scale(1.07)}80%{transform:translateX(3px) scale(1.07)}}
.p{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.bar{height:6px;border-radius:6px;background:#2d2459;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--root2),var(--root));box-shadow:0 0 12px var(--root);transition:width .4s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.pri{background:linear-gradient(135deg,#8f5cff,#6a3fd6);border-color:#b99bff;font-weight:700}.q{background:transparent}
.bc{position:relative;display:flex;flex-direction:column;justify-content:center}
.strip{display:flex;gap:8px;align-items:center;cursor:pointer}
.strip>span{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:13px}
.strip b{color:#fff;font-size:16px}.strip .acc{flex:1}
.strip i{flex:1;height:6px;border-radius:6px;background:#2d2459;overflow:hidden}.strip u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--root2),var(--good));transition:width .5s}
.bump{animation:pop .4s}
.mini{display:flex;gap:6px;margin-left:auto}.tb{padding:5px 10px;font-size:12px;border-radius:999px;background:transparent;color:var(--muted)}
.row{justify-content:flex-start;flex-wrap:wrap;gap:4px 10px}.row .shape{font-size:15px}.row .shape:before{display:none}.ib{border-color:#5b44a8}
.row{position:relative;min-height:26px}.verdict{position:absolute;inset:0;min-height:0;opacity:0;pointer-events:none;transition:opacity .2s}.row.v .verdict{opacity:1}
.row .shape,.row .hint,.row .mini{transition:opacity .2s}.row.v .shape,.row.v .hint,.row.v .mini{opacity:0;pointer-events:none}
.board{position:relative}.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:900;font-size:clamp(40px,min(15vw,22vh),96px);white-space:nowrap;color:#c8a6ff;opacity:.1}#board{position:relative;z-index:1}
.big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;font-weight:900;font-size:clamp(34px,min(15vw,24vh),96px);white-space:nowrap;line-height:1;color:var(--root);text-shadow:0 0 40px #c8a6ffcc,0 0 90px #8f5cff;animation:zoom 1.3s linear forwards}
@keyframes zoom{0%{transform:scale(.35);opacity:0;filter:blur(6px)}25%{transform:scale(.95);opacity:1;filter:blur(0)}60%{transform:scale(1.5);opacity:.8;filter:blur(2px)}100%{transform:scale(2.5);opacity:0;filter:blur(10px)}}
.board{background:linear-gradient(100deg,#2c2157,#1a1338);border:1px solid #4d3d93;border-radius:16px;padding:10px 10px 10px 6px;box-shadow:inset 0 0 30px #0b0620}
#board{display:grid;grid-template-columns:22px repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,var(--row))}
.sl{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#6f64a0}
.sl.on{color:#d9ccff}.sl.rl{color:var(--root);text-shadow:0 0 10px var(--root)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:2px solid #8478b4;opacity:.38}
.cell.on{opacity:1}.cell.last{border-right:3px solid #cfc6ee}
.cell:after{content:"";position:absolute;left:0;right:0;top:50%;height:var(--t);transform:translateY(-50%);background:linear-gradient(#e2d9ff,#8d82b3);pointer-events:none}
.cell button{position:relative;z-index:2;padding:0;border:0;display:grid;place-items:center;font-weight:850;font-size:calc(var(--d)*.46)}
.blank{width:100%;height:100%;background:transparent;border-radius:0}
.blank:before{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--root);opacity:0;transition:opacity .15s}
.blank:active:before{opacity:.45}@media(hover:hover){.blank:hover:before{opacity:.18}}
.dot{width:var(--d);height:var(--d);border-radius:50%;background:#4a3a86;border:2px solid #fff;color:#fff;box-shadow:0 3px 8px #0009}
.dot.root{background:radial-gradient(circle at 35% 30%,#f3e8ff,var(--root) 60%,var(--root2));color:#2a1457;border-color:#fff;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #c8a6ffaa,0 0 18px #b58cff99}100%{box-shadow:0 0 0 16px #c8a6ff00,0 0 18px #b58cff99}}
.dot.good{background:var(--good);color:#06291c;animation:pop .35s}
.dot.root.good{background:radial-gradient(circle at 35% 30%,#f3e8ff,var(--root) 60%,var(--root2));color:#2a1457;box-shadow:0 0 0 4px var(--good),0 0 18px var(--good)}
.dot.bad{background:var(--bad);color:#fff;animation:pop .3s}.dot.alt{background:var(--alt);color:#321b03;animation:pop .3s}.dot.rev{outline:3px dashed #fff8;outline-offset:3px}
@keyframes pop{from{transform:scale(.4)}60%{transform:scale(1.18)}}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.sheet{position:fixed;inset:0;z-index:9;background:#05020fcc;backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sh{width:min(100%,560px);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));animation:rise .3s}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:18px}
label{display:block;color:var(--muted);font-size:13px;margin:13px 0 6px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.checks{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;margin:0;background:var(--panel2);padding:9px 12px;border-radius:12px;color:var(--text);cursor:pointer}
input{accent-color:#a77bff;width:17px;height:17px}
.hero{display:flex;align-items:center;gap:16px;margin:10px 0}
.ring{width:132px;flex:none}.ring text{fill:#fff;font:800 22px system-ui}.trk{fill:none;stroke:#2d2459;stroke-width:9}
.arc{fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .9s}
.rank{font-size:19px;font-weight:850;color:var(--root);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tile{background:var(--panel2);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--muted)}.tile b{display:block;color:#fff;font-size:19px}
h4{margin:16px 0 8px;font-size:14px}
#heat{display:grid;grid-template-columns:24px repeat(7,1fr);gap:4px;align-items:center;font-size:12px;color:var(--muted);text-align:center}
#heat i{display:block;height:28px;border-radius:8px}
@media(min-width:760px),(orientation:landscape) and (max-height:600px){.layout{grid-template-columns:minmax(230px,.75fr) minmax(0,1.6fr)}.sheet{align-items:center}.sh{border-radius:24px}}
@media(min-width:760px){.step{font-size:32px}}
@media(orientation:landscape) and (max-height:600px){
:root{--row:clamp(24px,calc((100dvh - 118px)/6),50px)}
html,body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:6px}
header{margin-bottom:6px}.logo,.ib{width:34px;height:34px}.brand{font-size:17px}header .sub{display:none}
.layout{flex:1;min-height:0}.card{padding:10px;border-radius:18px}
.verdict{font-size:16px;min-height:26px}.strip>span{padding:3px 8px}.strip b{font-size:14px}.step{font-size:21px;min-width:46px;padding:6px 11px;border-radius:13px}#seq{gap:7px}
.controls button{padding:8px 11px;font-size:13px}.legend{margin-top:6px;font-size:11px}
.sh{max-height:94dvh}}
@media(max-height:420px) and (orientation:landscape){.legend{display:none}.hint.h2{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b58cff"/><stop offset=".55" stop-color="#7ab8ff"/><stop offset="1" stop-color="#35e0a1"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><g stroke="#1a0f33" stroke-width="1.6" stroke-linecap="round"><path d="M8 13h24M8 20h24M8 27h24" opacity=".7"/><path d="M16 9v22M25 9v22" opacity=".35"/></g><circle cx="25" cy="20" r="4.8" fill="#fff"/></svg>
  <div><div class="brand">CAGED Interval Trainer</div><div class="sub">Learn where every interval sits in each CAGED shape</div></div>
  <div class="sp"></div>
  <button class="ib" id="statsBtn" aria-label="Progress"><svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="0" y2="3"><stop stop-color="#9b6bff"/><stop offset=".5" stop-color="#7ab8ff"/><stop offset="1" stop-color="#35e0a1"/></linearGradient></defs><rect x="3" y="12" width="4.5" height="9" rx="1.5" fill="url(#sg)"/><rect x="9.75" y="7" width="4.5" height="14" rx="1.5" fill="url(#sg)"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5" fill="url(#sg)"/></svg></button>
  <button class="ib" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" width="24" height="24"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6d6ff"/><stop offset="1" stop-color="#9b6bff"/></linearGradient></defs><circle cx="12" cy="12" r="8.7" fill="none" stroke="url(#gg)" stroke-width="3.2" stroke-dasharray="3.42 3.42"/><circle cx="12" cy="12" r="6.4" fill="url(#gg)"/><circle cx="12" cy="12" r="2.6" fill="#241b4a"/></svg></button>
</header>
<main class="layout">
  <section class="card task">
    <div class="strip" id="strip" role="button" tabindex="0" aria-label="Open progress"><span title="Current streak">🔥<b id="mK">0</b></span><span title="Record streak">🏆<b id="mB">0</b></span><span class="acc" title="Accuracy"><b id="mA">–</b><i><u id="mBar"></u></i></span></div>
    <div class="row"><div class="verdict" id="verdict" aria-live="polite"></div><div class="shape">Progression</div><div class="hint" id="pos"></div><div class="mini"><button class="tb" id="revealBtn" title="Show answer">👁 Answer</button><button class="tb" id="nextBtn" title="New progression">↻ New</button></div></div>
    <div id="seq"></div>
    <div class="bar"><div id="bar"></div></div>
  </section>
  <section class="card bc" id="bc">
    <div class="board"><div class="wm" id="wm"></div><div id="board"></div></div>
    <div class="legend">
      <span><i style="background:var(--root)"></i>Root</span><span><i style="background:var(--good)"></i>Correct</span><span><i style="background:var(--bad)"></i>Wrong</span><span><i style="background:var(--alt)"></i>Other spot</span>
    </div>
  </section>
</main>
</div>

<div class="sheet" id="settings" hidden><div class="sh">
  <div class="shh"><b>Settings</b><button class="q" data-close>✕</button></div>
  <label>Shapes to practice</label><div class="checks" id="shapeChecks"></div>
  <label>Interval display</label><select id="numeralMode"><option value="arabic">Numbers · 1 2 3 4 5 6 7</option><option value="roman">Roman · I ii iii IV V vi vii°</option></select>
  <label>Progression type</label><select id="mode"><option value="common">Common chord progressions</option><option value="random">Random (no repeats)</option></select>
  <label>Progression length</label><select id="length"><option value="2">2 chords</option><option value="3" selected>3 chords</option><option value="4">4 chords</option></select>
  <div class="checks" style="margin-top:14px">
    <label class="check"><input type="checkbox" id="sound" checked>Sound</label>
    <label class="check"><input type="checkbox" id="replay" checked>Replay progression at the end</label>
    <label class="check"><input type="checkbox" id="exclude7">Skip the 7th</label>
    <label class="check"><input type="checkbox" id="showShape" checked>Show shape names</label>
    <label class="check"><input type="checkbox" id="adaptive">Drill my weak spots</label>
  </div>
</div></div>

<div class="sheet" id="stats" hidden><div class="sh">
  <div class="shh"><b>Your progress</b><button class="q" data-close>✕</button></div>
  <div class="hero">
    <svg viewBox="0 0 100 100" class="ring"><defs><linearGradient id="g"><stop stop-color="#c8a6ff"/><stop offset="1" stop-color="#35e0a1"/></linearGradient></defs><circle cx="50" cy="50" r="42" class="trk"/><circle id="ring" cx="50" cy="50" r="42" class="arc" transform="rotate(-90 50 50)"/><text x="50" y="57" id="accTxt" text-anchor="middle">–</text></svg>
    <div style="flex:1"><div class="rank" id="rank"></div>
      <div class="tiles"><div class="tile">🔥 Streak<b id="stK">0</b></div><div class="tile">🏆 Best<b id="stB">0</b></div><div class="tile">✓ Hits<b id="stC">0</b></div><div class="tile">✕ Misses<b id="stE">0</b></div></div>
    </div>
  </div>
  <h4>Heatmap · shape × interval</h4>
  <div id="heat"></div>
  <p class="hint" id="weak" style="margin:10px 0 0"></p>
  <div class="controls"><button class="q" id="resetStats">Reset stats</button></div>
</div></div>

<script>
(()=>{"use strict";
const S=["e","B","G","D","A","E"],ACT=["D","A","E"],TH=[1,1.5,2,2.8,3.6,4.6];
const shapes={
 C:{root:[4,4],canonical:{1:["A",4],2:["D",1],3:["E",1],4:["E",2],5:["E",4],6:["A",1],7:["A",3]},alts:[["D",3,3],["D",4,4]]},
 A:{root:[4,1],canonical:{1:["A",1],2:["A",3],3:["D",0],4:["D",1],5:["E",1],6:["E",3],7:["A",0]},alts:[["D",3,5]]},
 G:{root:[5,4],canonical:{1:["E",4],2:["A",1],3:["A",3],4:["A",4],5:["D",1],6:["E",1],7:["E",3]},alts:[["D",3,6]]},
 E:{root:[5,1],canonical:{1:["E",1],2:["E",3],3:["A",0],4:["A",1],5:["A",3],6:["D",0],7:["E",0]},alts:[["D",2,7],["D",3,1]]},
 D:{root:[3,1],canonical:{1:["D",1],2:["E",1],3:["E",3],4:["E",4],5:["A",1],6:["A",3],7:["D",0]},alts:[["D",3,2]]}
};
const common=[[1,4,5],[1,5,6,4],[6,4,1,5],[2,5,1],[6,5,3,4],[1,6,2,5],[1,4,6,5]];
const roman=["","I","ii","iii","IV","V","vi","vii°"],praise=["Nice!","Clean!","Locked in!","Boom!","Yes!","Smooth!"];
const ranks=[[0,"Warm-up"],[10,"Fret Scout"],[50,"Shape Shifter"],[150,"CAGED Wizard"],[400,"Fretboard Legend"]];
const $=id=>document.getElementById(id),pick=a=>a[Math.random()*a.length|0];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DEF={correct:0,errors:0,streak:0,best:0,weak:{},ok:{}};
let selected=Object.keys(shapes),seq=[],step=0,shapeKey="C",found=[],flash=null,solution=false,locked=false,lastIv=0,lastShape="",lastSeq="",ft,nt,rt,stats={...DEF};
try{stats={...DEF,...JSON.parse(localStorage.getItem("cagedStats")||"{}")};selected=JSON.parse(localStorage.getItem("cagedShapes")||"null")||selected}catch(e){}
function save(){try{localStorage.setItem("cagedStats",JSON.stringify(stats));localStorage.setItem("cagedShapes",JSON.stringify(selected))}catch(e){}}
const display=n=>$("numeralMode").value==="roman"?roman[n]:String(n);
const ROOT={C:48,A:45,G:43,E:40,D:38},SEMI=[0,2,4,5,7,9,11];
let ac;
let bus;
function ctx(){
 if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();
  // acoustic-body resonances + short room reverb
  const eq=[[105,5,1.3],[215,3.5,1.5],[450,-2,1]].map(([f,g,q])=>{const b=ac.createBiquadFilter();b.type="peaking";b.frequency.value=f;b.gain.value=g;b.Q.value=q;return b});
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2800;
  const cv=ac.createConvolver(),wet=ac.createGain(),n=ac.sampleRate*.9|0,ir=ac.createBuffer(2,n,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
  cv.buffer=ir;wet.gain.value=.2;
  bus=ac.createGain();bus.connect(eq[0]);eq[0].connect(eq[1]);eq[1].connect(eq[2]);eq[2].connect(lp);lp.connect(ac.destination);lp.connect(cv);cv.connect(wet);wet.connect(ac.destination)}
 ac.resume();return ac}
function pluck(midi,vol=.9){ // Karplus-Strong string + body resonance
 if(!$("sound").checked)return;
 try{const a=ctx(),t=a.currentTime,f=440*2**((midi-69)/12),sr=a.sampleRate,N=sr*2.2|0,P=Math.round(sr/f-.5),buf=a.createBuffer(1,N,sr),d=buf.getChannelData(0);
  let y=0;for(let i=0;i<P;i++){y+=(Math.random()*2-1-y)*.3;d[i]=y} // soft pick noise
  const pp=Math.max(2,P*.18|0);for(let i=P-1;i>=pp;i--)d[i]-=d[i-pp]*.3; // pick position
  for(let i=P;i<N;i++)d[i]=(d[i-P]+d[i-P+1])*.4975; // string damping
  const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.setTargetAtTime(0,t+1.3,.25);s.connect(g).connect(bus);s.start(t)}catch(e){}
}
function buzz(){
 if(!$("sound").checked)return;
 try{const a=ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(60,t+.15);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.2)}catch(e){}
}
function bigLetter(k){const e=document.createElement("div");e.className="big";e.textContent=k+"-Shape";$("bc").append(e);setTimeout(()=>e.remove(),1350)}
let vt;function say(kind,text,ms=1700){const v=$("verdict"),r=v.parentElement;clearTimeout(vt);v.className="verdict";void v.offsetWidth;v.className="verdict "+kind;v.textContent=text;r.classList.toggle("v",!!text);if(text)vt=setTimeout(()=>r.classList.remove("v"),ms)}

function chooseShape(){
 let list=selected.length?selected:Object.keys(shapes);
 if(list.length>1)list=list.filter(k=>k!==lastShape);
 if($("adaptive").checked){
  const w=list.map(k=>1+Object.entries(stats.weak).filter(([x])=>x.startsWith(k+"-")).reduce((n,[,v])=>n+v,0));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0){shapeKey=list[i];return}}
 }
 shapeKey=pick(list);
}
function makeSeq(){
 const len=+$("length").value,ex=$("exclude7").checked,rnd=$("mode").value==="random";
 const pool=[1,2,3,4,5,6,7].filter(n=>!ex||n<7);
 let out;
 if(!rnd){const c=common.filter(x=>x.length===len&&(!ex||!x.includes(7))&&x.join()!==lastSeq);if(c.length)out=[...pick(c)]}
 if(!out){out=shuf(pool).slice(0,len);if(out[0]===lastIv)[out[0],out[1]]=[out[1],out[0]]} // every interval once, never the same twice in a row
 if($("adaptive").checked){
  const weak=Object.entries(stats.weak).filter(([k])=>k.startsWith(shapeKey+"-")).map(([k,v])=>[+k.split("-")[1],v]).filter(([n])=>pool.includes(n)&&!out.includes(n));
  if(weak.length){
   const n=pick(weak.flatMap(([n,v])=>Array(Math.min(v,8)).fill(n))),i=Math.random()*out.length|0;
   if(!(rnd&&i===0&&n===lastIv))out[i]=n;
  }
 }
 return out;
}
function newProgression(){
 clearTimeout(nt);clearTimeout(ft);chooseShape();lastShape=shapeKey;
 seq=makeSeq();lastSeq=seq.join();lastIv=seq[seq.length-1];
 step=0;found=[];flash=null;solution=false;locked=false;
 buildSeq();board();stat();say("","");
}
function buildSeq(){
 const q=$("seq");q.innerHTML="";
 seq.forEach((n,i)=>{const e=document.createElement("span");e.className="step pre"+(n===1?" r":"");e.textContent=display(n);e.style.transitionDelay=i*70+"ms";q.append(e)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{q.querySelectorAll(".pre").forEach(x=>x.classList.remove("pre"));setTimeout(()=>q.querySelectorAll(".step").forEach(x=>x.style.transitionDelay=""),600)}));
 upd();
}
function upd(){
 [...$("seq").children].forEach((e,i)=>{if(e.dataset.p)return;e.classList.toggle("done",i<step);e.classList.toggle("cur",i===step)});
 $("pos").textContent=step<seq.length?`Interval ${step+1} of ${seq.length}`:"Cleared!";
 $("bar").style.width=step/seq.length*100+"%";
 $("wm").textContent=$("showShape").checked?shapeKey+"-Shape":"";
}
function burst(el,color,n){
 const q=$("seq"),x=el.offsetLeft+el.offsetWidth/2,y=el.offsetTop+el.offsetHeight/2;
 for(let i=0;i<n;i++){const p=document.createElement("i"),a=Math.PI*2*i/n+Math.random()*.6,d=34+Math.random()*38;
  p.className="p";p.style.cssText=`left:${x}px;top:${y}px;--c:${color};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;q.append(p);setTimeout(()=>p.remove(),1250)}
}
function board(){
 const b=$("board"),sh=shapes[shapeKey];b.innerHTML="";
 S.forEach((s,si)=>{
  const on=ACT.includes(s),l=document.createElement("div");
  l.className="sl"+(on?" on":"")+(si===sh.root[0]?" rl":"");l.textContent=s;b.append(l);
  for(let c=0;c<5;c++){
   const cell=document.createElement("div");cell.className="cell"+(on?" on":"")+(c===4?" last":"");cell.style.setProperty("--t",TH[si]+"px");
   if(on){
    const btn=document.createElement("button"),isRoot=sh.root[0]===si&&sh.root[1]===c,rc=isRoot?" root":"";
    let cls="blank",txt="";
    if(isRoot){cls="dot root";txt=display(1)}
    const f=found.find(x=>x.row===s&&x.col===c);
    if(f){cls="dot good"+rc;txt=display(f.n)}
    if(flash&&flash.row===s&&flash.col===c){cls="dot "+flash.kind+rc;txt=flash.kind==="alt"?"↗":"×"}
    if(solution){const t=seq[step],cn=sh.canonical[t];if(cn[0]===s&&cn[1]===c){cls="dot good rev"+rc;txt=display(t)}}
    btn.className=cls;btn.textContent=txt;btn.setAttribute("aria-label",`${s} string, position ${c+1}`);
    btn.onclick=()=>answer(s,c);cell.append(btn);
   }
   b.append(cell);
  }
 });
}
function answer(row,col){
 if(solution||locked||step>=seq.length)return;
 const t=seq[step],sh=shapes[shapeKey],c=sh.canonical[t],el=$("seq").children[step],key=shapeKey+"-"+t;
 clearTimeout(ft);
 if(sh.alts.some(a=>a[0]===row&&a[1]===col&&a[2]===t)){
  flash={row,col,kind:"alt"};say("alt","Right note, other spot – find the standard position",2600);
  ft=setTimeout(()=>{flash=null;board()},1500);board();return;
 }
 if(c[0]===row&&c[1]===col){
  stats.correct++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.ok[key]=(stats.ok[key]||0)+1;save();
  found.push({row,col,n:t});flash=null;pluck(ROOT[shapeKey]+SEMI[t-1]);
  el.dataset.p=1;el.classList.remove("cur");el.classList.add("puff");burst(el,"#35e0a1",14);
  setTimeout(()=>{el.classList.remove("puff");delete el.dataset.p;upd()},1120);
  step++;
  if(step>=seq.length){locked=true;say("good","Progression cleared! 🎉");setTimeout(()=>bigLetter(shapeKey),260);if($("replay").checked){const k=shapeKey;seq.forEach((n,i)=>setTimeout(()=>pluck(ROOT[k]+SEMI[n-1],.75),320+i*230))}nt=setTimeout(newProgression,1600)}
  else say("good",stats.streak%5===0?`🔥 ${stats.streak} in a row!`:pick(praise));
  upd();board();stat();return;
 }
 stats.errors++;stats.streak=0;stats.weak[key]=(stats.weak[key]||0)+1;save();
 flash={row,col,kind:"bad"};say("bad","Not quite – try again");buzz();
 el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");burst(el,"#ff5d7a",8);
 setTimeout(()=>el.classList.remove("shake"),480);
 ft=setTimeout(()=>{flash=null;board()},900);board();stat();
}
function stat(){
 const tot=stats.correct+stats.errors,acc=tot?stats.correct/tot:0;
 $("accTxt").textContent=tot?Math.round(acc*100)+"%":"–";$("ring").style.strokeDashoffset=264*(1-acc);
 const mk=$("mK").parentElement;if(stats.streak>+$("mK").textContent){mk.classList.remove("bump");void mk.offsetWidth;mk.classList.add("bump")}
 $("mK").textContent=stats.streak;$("mB").textContent=stats.best;$("mA").textContent=tot?Math.round(acc*100)+"%":"–";$("mBar").style.width=acc*100+"%";
 $("stK").textContent=stats.streak;$("stB").textContent=stats.best;$("stC").textContent=stats.correct;$("stE").textContent=stats.errors;
 $("rank").textContent=ranks.filter(r=>stats.correct>=r[0]).pop()[1];
 const h=$("heat");h.innerHTML="<span></span>"+[1,2,3,4,5,6,7].map(n=>`<span>${display(n)}</span>`).join("");
 Object.keys(shapes).forEach(k=>{
  h.insertAdjacentHTML("beforeend",`<span style="color:var(--root);font-weight:800">${k}</span>`);
  for(let n=1;n<=7;n++){const key=k+"-"+n,ok=stats.ok[key]||0,bad=stats.weak[key]||0,t=ok+bad;
   h.insertAdjacentHTML("beforeend",`<i title="${k} shape · ${n}: ${ok} hits, ${bad} misses" style="background:${t?`hsl(${Math.round(ok/t*125)} 70% 42%)`:"#2d2459"}"></i>`)}
 });
 const w=Object.entries(stats.weak).sort((a,b)=>b[1]-a[1])[0];
 $("weak").textContent=w?`Toughest spot: ${w[0].split("-")[0]} shape, interval ${display(+w[0].split("-")[1])} (${w[1]} misses)`:"Play a few rounds and the heatmap lights up.";
}
function buildChecks(){
 const wrap=$("shapeChecks");wrap.innerHTML="";
 Object.keys(shapes).forEach(k=>{const lab=document.createElement("label"),cb=document.createElement("input");lab.className="check";cb.type="checkbox";cb.checked=selected.includes(k);
  cb.onchange=()=>{selected=cb.checked?[...selected,k]:selected.filter(x=>x!==k);if(!selected.length){selected=[k];cb.checked=true}save()};
  lab.append(cb,document.createTextNode(k+" shape"));wrap.append(lab)});
}
const sheet=(id,other)=>{$(id).hidden=!$(id).hidden;$(other).hidden=true;stat()};
$("setBtn").onclick=()=>sheet("settings","stats");$("statsBtn").onclick=()=>sheet("stats","settings");$("strip").onclick=()=>sheet("stats","settings");
$("sound").onchange=()=>{try{localStorage.setItem("cagedSound",$("sound").checked?"1":"0")}catch(e){}pluck(60)};
$("replay").onchange=()=>{try{localStorage.setItem("cagedReplay",$("replay").checked?"1":"0")}catch(e){}};
document.querySelectorAll(".sheet").forEach(s=>s.onclick=e=>{if(e.target===s||e.target.hasAttribute("data-close"))s.hidden=true});
$("nextBtn").onclick=newProgression;
$("numeralMode").onchange=()=>{[...$("seq").children].forEach((e,i)=>e.textContent=display(seq[i]));board();stat()};
$("showShape").onchange=upd;
["mode","length","exclude7","adaptive"].forEach(id=>$(id).onchange=newProgression);
$("revealBtn").onclick=()=>{if(step>=seq.length)return;solution=true;board();say("","Answer shown – tap “↻ New” to continue",4000)};
$("resetStats").onclick=()=>{const b=$("resetStats");if(!b.dataset.s){b.dataset.s=1;b.textContent="Tap again to confirm";rt=setTimeout(()=>{delete b.dataset.s;b.textContent="Reset stats"},2500);return}
 clearTimeout(rt);delete b.dataset.s;b.textContent="Reset stats";stats={...DEF,weak:{},ok:{}};save();stat()};
try{if(localStorage.getItem("cagedSound")==="0")$("sound").checked=false;if(localStorage.getItem("cagedReplay")==="0")$("replay").checked=false}catch(e){}
buildChecks();newProgression();
})();
</script>
